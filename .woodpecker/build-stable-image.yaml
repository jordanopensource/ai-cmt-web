when:
  - event: [push, manual]
    branch: [main]
  - event: [pull_request]
    evaluate: 'CI_COMMIT_TARGET_BRANCH == "main"'
    branch:
      exclude: [main]

variables:
  - &registry_url 'https://registry.cloud.josa.ngo'
  - &docker_repo 'registry.cloud.josa.ngo/library/ai-cmt-web'
  - &slack_channel 'builds'
  - &success_message >
    ✅ *SUCCESS* - Stable Build #{{ build.number }}

    📁 *Repository:* {{ repo.name }}
    🌿 *Branch:* {{ build.branch }}
    📝 *Commit:* {{ truncate build.commit 8 }}
    👤 *Author:* {{ build.author }}

    🔗 *Links:*
    • <{{ build.link }}|View Build>
  - &failure_message >
    ❌ *FAILED* - Stable Build #{{ build.number }}

    📁 *Repository:* {{ repo.name }}
    🌿 *Branch:* {{ build.branch }}
    📝 *Commit:* {{ truncate build.commit 8 }}
    👤 *Author:* {{ build.author }}

    🔗 *Links:*
    • <{{ build.link }}|View Build>

steps:
  - name: lint-format-check
    image: node:24-slim
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm run format:check

  - name: build-stable-image
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: *docker_repo
      registry: *registry_url
      dockerfile: ./Dockerfile
      tags:
        - stable-${CI_COMMIT_SHA}
        - stable
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_SECRET
      build_args:
        - CI_COMMIT_SHA=${CI_COMMIT_SHA}
        - CI_REPO_URL=${CI_REPO_URL}
        - CI_REPO_NAME=${CI_REPO_NAME}
        - CI_PIPELINE_URL=${CI_PIPELINE_URL}
        - CI_PIPELINE_CREATED=${CI_PIPELINE_CREATED}
    depends_on:
      - lint-format-check

  - name: notify-slack-stable-success
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: *slack_channel
      template: *success_message
    when:
      - status: success
    depends_on:
      - lint-format-check
      - build-stable-image

  - name: notify-slack-stable-failure
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: *slack_channel
      template: *failure_message
    when:
      - status: failure
    depends_on:
      - lint-format-check
      - build-stable-image
